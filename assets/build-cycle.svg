<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Shubham's circular learning and building workflow</title>
  <desc id="desc">Ideas flow through research, AI-assisted development, prototyping, testing, cloud deployment, improvement, and return to ideas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#17172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#181829"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="900" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="450" cy="280" r="190" fill="none" stroke="#6366f1" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="6 10"/>

  <g fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.9">
    <path d="M520 72 C590 75 635 87 682 112"/>
    <path d="M765 150 C790 180 800 210 799 247"/>
    <path d="M760 310 C742 360 715 394 674 423"/>
    <path d="M585 466 C515 492 438 499 377 479"/>
    <path d="M294 450 C229 428 190 397 160 363"/>
    <path d="M133 316 C112 260 119 213 143 177"/>
    <path d="M218 120 C279 82 342 67 382 66"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(380 38)">
      <rect width="140" height="62" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.75"/>
      <text x="70" y="38" fill="#f8fafc" font-size="17" font-weight="600">Ideas</text>
    </g>
    <g transform="translate(660 100)">
      <rect width="150" height="62" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.75"/>
      <text x="75" y="38" fill="#f8fafc" font-size="17" font-weight="600">Research</text>
    </g>
    <g transform="translate(700 248)">
      <rect width="184" height="68" rx="19" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.75"/>
      <text x="92" y="29" fill="#f8fafc" font-size="15" font-weight="600">AI-assisted</text>
      <text x="92" y="50" fill="#c4b5fd" font-size="15">Development</text>
    </g>
    <g transform="translate(575 420)">
      <rect width="154" height="62" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.75"/>
      <text x="77" y="38" fill="#f8fafc" font-size="17" font-weight="600">Prototype</text>
    </g>
    <g transform="translate(275 432)">
      <rect width="140" height="62" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.75"/>
      <text x="70" y="38" fill="#f8fafc" font-size="17" font-weight="600">Testing</text>
    </g>
    <g transform="translate(48 306)">
      <rect width="176" height="68" rx="19" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.75"/>
      <text x="88" y="29" fill="#f8fafc" font-size="15" font-weight="600">Cloud</text>
      <text x="88" y="50" fill="#c4b5fd" font-size="15">Deployment</text>
    </g>
    <g transform="translate(112 105)">
      <rect width="160" height="62" rx="18" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.75"/>
      <text x="80" y="38" fill="#f8fafc" font-size="17" font-weight="600">Improvement</text>
    </g>
  </g>

  <g text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="450" cy="280" r="94" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>
    <circle cx="450" cy="280" r="77" fill="url(#core)" stroke="#c4b5fd" stroke-width="2"/>
    <circle cx="430" cy="258" r="19" fill="#fff" opacity="0.18"/>
    <text x="450" y="270" fill="#ffffff" font-size="18" font-weight="700">BUILD • LEARN</text>
    <text x="450" y="298" fill="#e0e7ff" font-size="18" font-weight="700">ITERATE</text>
  </g>
</svg>
